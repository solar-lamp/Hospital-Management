<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MediTrack HMS</title>
  <meta name="description" content="MediTrack: hospital management and resource tracking demo built with Python, Streamlit and SQLite, running in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
  <style>
    #boot { font-family: system-ui, sans-serif; max-width: 560px; margin: 18vh auto 0; padding: 0 16px; color: #333; text-align: center; }
    #boot h1 { margin-bottom: .2em; }
    #boot p { color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <h1>🏥 MediTrack</h1>
      <p>Starting the hospital management app in your browser&hellip;<br>
      The first visit downloads Python (about 30&nbsp;MB) and builds fictional demo data;
      later visits are faster.</p>
      <noscript><p><strong>JavaScript is required.</strong></p></noscript>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    const files = ["app.py", "config.py", "database.py", "seed.py", "pages/0_Dashboard.py", "pages/10_Settings.py", "pages/1_Patients.py", "pages/2_Doctors_and_Staff.py", "pages/3_Appointments.py", "pages/4_Admissions_and_Beds.py", "pages/5_Medicine_Inventory.py", "pages/6_Suppliers.py", "pages/7_Billing_and_Payments.py", "pages/8_Reports.py", "pages/9_User_Management.py", "services/__init__.py", "services/admission_service.py", "services/appointment_service.py", "services/audit_service.py", "services/auth_service.py", "services/billing_service.py", "services/patient_service.py", "services/pharmacy_service.py", "services/report_service.py", "services/staff_service.py", "repositories/__init__.py", "repositories/admission_repository.py", "repositories/appointment_repository.py", "repositories/audit_repository.py", "repositories/billing_repository.py", "repositories/common.py", "repositories/patient_repository.py", "repositories/pharmacy_repository.py", "repositories/report_repository.py", "repositories/staff_repository.py", "repositories/user_repository.py", "utils/__init__.py", "utils/charts.py", "utils/clock.py", "utils/export_utils.py", "utils/formatting.py", "utils/permissions.py", "utils/ui.py", "utils/validators.py"];
    mount({
      entrypoint: "app.py",
      files: Object.fromEntries(files.map((f) => [f, { url: "./app/" + f }])),
      requirements: ["plotly==7.1.0", "openpyxl==3.1.5"],
      prebuiltPackageNames: ["sqlite3", "hashlib"],
      idbfsMountpoints: ["/meditrack"],
      env: {"HMS_DB_PATH": "/meditrack/hospital.db", "HMS_DEMO_MODE": "1", "HMS_AUTO_SEED_DEMO": "1", "HMS_PBKDF2_ITERATIONS": "210000"},
      streamlitConfig: {
        "client.toolbarMode": "minimal",
        "theme.primaryColor": "#2a78d6",
      },
    }, document.getElementById("root"));
  </script>
</body>
</html>
