name: Deploy to GitHub Pages

# Builds the in-browser (stlite) version of the app, checks it in a real
# browser, and publishes it to GitHub Pages from the default branch.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  browser-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python scripts/build_site.py
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the site and run the smoke test
        run: |
          python -m http.server 8000 -d _site >/dev/null 2>&1 &
          sleep 2
          node scripts/browser_smoke.mjs http://localhost:8000/ smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: smoke/

  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, browser-smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages (GitHub Actions source) if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@v4
